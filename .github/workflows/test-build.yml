name: Test Build System

on:
  push:
    branches: [ main ]
    paths:
      - 'build/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-dependencies:
    name: Test Dependency Installation
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Make scripts executable
      run: chmod +x build/*.sh
    
    - name: Install dependencies
      run: sudo ./build/install-dependencies.sh
    
    - name: Check dependencies
      run: ./build/check-dependencies.sh
    
    - name: Show disk space
      run: df -h
  
  test-base-build:
    name: Test Base Edition Build (Quick)
    runs-on: ubuntu-22.04
    needs: test-dependencies
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Free up disk space
      run: |
        echo "Before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        echo "After cleanup:"
        df -h
    
    - name: Make scripts executable
      run: chmod +x build/*.sh
    
    - name: Install dependencies
      run: sudo ./build/install-dependencies.sh
    
    - name: Build Base Edition (fast compression)
      run: sudo ./build/build.sh base --compression=3 --verbose
      timeout-minutes: 60
    
    - name: Check output
      run: |
        ls -lh build/output/
        file build/output/wilderedos-base-*.iso
    
    - name: Show build logs
      if: failure()
      run: |
        echo "=== Build Logs ==="
        cat build/work/logs/*.log || echo "No logs found"
    
    - name: Upload ISO for testing
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: wilderedos-base-test-iso
        path: build/output/wilderedos-base-*.iso
        retention-days: 7
