name: Build WilderedOS ISOs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-base:
    name: Build Base Edition
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h
    
    - name: Install dependencies
      run: |
        sudo ./build/install-dependencies.sh
    
    - name: Verify dependencies
      run: |
        ./build/check-dependencies.sh
    
    - name: Build Base Edition ISO
      run: |
        sudo ./build/build.sh base --compression=6
    
    - name: Verify ISO was created
      run: |
        ls -lh build/output/
        test -f build/output/wilderedos-base-*.iso
    
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: wilderedos-base-iso
        path: |
          build/output/wilderedos-base-*.iso
          build/output/wilderedos-base-*.md5
          build/output/wilderedos-base-*.sha256
          build/output/wilderedos-base-*.info
        retention-days: 30
    
    - name: Upload to release (if release event)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/output/wilderedos-base-*.iso
          build/output/wilderedos-base-*.md5
          build/output/wilderedos-base-*.sha256
          build/output/wilderedos-base-*.info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-standard:
    name: Build Standard Edition
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h
    
    - name: Install dependencies
      run: |
        sudo ./build/install-dependencies.sh
    
    - name: Build Standard Edition ISO
      run: |
        sudo ./build/build.sh standard --compression=6
    
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: wilderedos-standard-iso
        path: |
          build/output/wilderedos-standard-*.iso
          build/output/wilderedos-standard-*.md5
          build/output/wilderedos-standard-*.sha256
          build/output/wilderedos-standard-*.info
        retention-days: 30
    
    - name: Upload to release (if release event)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/output/wilderedos-standard-*.iso
          build/output/wilderedos-standard-*.md5
          build/output/wilderedos-standard-*.sha256
          build/output/wilderedos-standard-*.info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build Test Edition
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h
    
    - name: Install dependencies
      run: |
        sudo ./build/install-dependencies.sh
    
    - name: Build Test Edition ISO
      run: |
        sudo ./build/build.sh test --compression=6
    
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: wilderedos-test-iso
        path: |
          build/output/wilderedos-test-*.iso
          build/output/wilderedos-test-*.md5
          build/output/wilderedos-test-*.sha256
          build/output/wilderedos-test-*.info
        retention-days: 30
    
    - name: Upload to release (if release event)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/output/wilderedos-test-*.iso
          build/output/wilderedos-test-*.md5
          build/output/wilderedos-test-*.sha256
          build/output/wilderedos-test-*.info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-full:
    name: Build Full Edition
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h
    
    - name: Install dependencies
      run: |
        sudo ./build/install-dependencies.sh
    
    - name: Build Full Edition ISO
      run: |
        sudo ./build/build.sh full --compression=6
    
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: wilderedos-full-iso
        path: |
          build/output/wilderedos-full-*.iso
          build/output/wilderedos-full-*.md5
          build/output/wilderedos-full-*.sha256
          build/output/wilderedos-full-*.info
        retention-days: 30
    
    - name: Upload to release (if release event)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/output/wilderedos-full-*.iso
          build/output/wilderedos-full-*.md5
          build/output/wilderedos-full-*.sha256
          build/output/wilderedos-full-*.info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
