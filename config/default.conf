#!/bin/bash
################################################################################
# WilderedOS Default Build Configuration
# This file contains default settings for the build system
# Override these in config/local.conf (git-ignored)
################################################################################

# WilderedOS version
WILDEREDOS_VERSION="1.0.0"
WILDEREDOS_CODENAME="Pioneer"

# Base distribution
UBUNTU_RELEASE="jammy"  # Ubuntu 22.04 LTS
UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"

# Architecture
ARCH="${ARCH:-amd64}"  # amd64 or i386

# Build directories
SCRIPT_DIR="${SCRIPT_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
PROJECT_ROOT="$(dirname "$SCRIPT_DIR")"
WORK_DIR="${WORK_DIR:-$SCRIPT_DIR/work}"
CHROOT_DIR="${CHROOT_DIR:-$WORK_DIR/chroot}"
IMAGE_DIR="${IMAGE_DIR:-$WORK_DIR/image}"
CACHE_DIR="${CACHE_DIR:-$WORK_DIR/cache}"
LOG_DIR="${LOG_DIR:-$WORK_DIR/logs}"
OUTPUT_DIR="${OUTPUT_DIR:-$SCRIPT_DIR/output}"

# Build options
BUILD_CACHE_ENABLED=true
INCREMENTAL=${INCREMENTAL:-false}
COMPRESSION_LEVEL=${COMPRESSION_LEVEL:-9}  # 1-9, higher = smaller but slower
PARALLEL_JOBS=${PARALLEL_JOBS:-$(nproc)}   # Number of parallel jobs

# Compression options
SQUASHFS_COMP="xz"  # xz, gzip, lzo, lz4, zstd
SQUASHFS_OPTS="-comp $SQUASHFS_COMP -Xbcj x86 -b 1M"

# ISO options
ISO_PREFIX="wilderedos"
ISO_VOLUME_ID="WilderedOS"
ISO_PUBLISHER="WilderedOS Project"
ISO_APPLICATION="WilderedOS ${WILDEREDOS_VERSION}"

# Kernel options
KERNEL_PACKAGE="linux-image-generic"
KERNEL_FLAVOR="generic"  # generic, lowlatency, or specific version

# Boot options
GRUB_TIMEOUT=10
GRUB_DEFAULT=0

# Live system options
LIVE_USER="wilderedos"
LIVE_USER_FULLNAME="WilderedOS User"
LIVE_HOSTNAME="wilderedos-live"

# Package management
APT_CACHE_LIMIT=500  # MB
APT_RECOMMENDS=false
APT_SUGGESTS=false

# Cleanup options
CLEAN_APT_CACHE=true
CLEAN_LOGS=true
CLEAN_TMP=true
CLEAN_CACHE=false  # Keep cache for incremental builds

# Debug options
VERBOSE=${VERBOSE:-false}
DEBUG=${DEBUG:-false}
SKIP_CHECKSUMS=${SKIP_CHECKSUMS:-false}
NO_CLEANUP=${NO_CLEANUP:-false}

# Reproducible builds
REPRODUCIBLE_BUILD=false
BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(date +%s)}"

# Color output
if [[ -t 1 ]]; then
    USE_COLOR=true
else
    USE_COLOR=false
fi

################################################################################
# Functions for configuration
################################################################################

# Check if running as root
check_root() {
    if [[ $EUID -ne 0 ]]; then
        echo "Error: This script must be run as root" >&2
        return 1
    fi
    return 0
}

# Validate architecture
validate_arch() {
    case "$ARCH" in
        amd64|i386)
            return 0
            ;;
        *)
            echo "Error: Unsupported architecture: $ARCH" >&2
            echo "Supported: amd64, i386" >&2
            return 1
            ;;
    esac
}

# Validate compression level
validate_compression() {
    if [[ ! "$COMPRESSION_LEVEL" =~ ^[1-9]$ ]]; then
        echo "Error: Invalid compression level: $COMPRESSION_LEVEL" >&2
        echo "Must be 1-9" >&2
        return 1
    fi
    return 0
}

# Export all configuration for sub-scripts
export_config() {
    export WILDEREDOS_VERSION WILDEREDOS_CODENAME
    export UBUNTU_RELEASE UBUNTU_MIRROR
    export ARCH
    export SCRIPT_DIR PROJECT_ROOT
    export WORK_DIR CHROOT_DIR IMAGE_DIR CACHE_DIR LOG_DIR OUTPUT_DIR
    export BUILD_CACHE_ENABLED INCREMENTAL COMPRESSION_LEVEL PARALLEL_JOBS
    export SQUASHFS_COMP SQUASHFS_OPTS
    export ISO_PREFIX ISO_VOLUME_ID ISO_PUBLISHER ISO_APPLICATION
    export KERNEL_PACKAGE KERNEL_FLAVOR
    export GRUB_TIMEOUT GRUB_DEFAULT
    export LIVE_USER LIVE_USER_FULLNAME LIVE_HOSTNAME
    export APT_CACHE_LIMIT APT_RECOMMENDS APT_SUGGESTS
    export CLEAN_APT_CACHE CLEAN_LOGS CLEAN_TMP CLEAN_CACHE
    export VERBOSE DEBUG SKIP_CHECKSUMS NO_CLEANUP
    export REPRODUCIBLE_BUILD BUILD_TIMESTAMP SOURCE_DATE_EPOCH
    export USE_COLOR
}

# Print configuration summary
print_config() {
    cat << EOF
Build Configuration:
  Version: $WILDEREDOS_VERSION ($WILDEREDOS_CODENAME)
  Base: Ubuntu $UBUNTU_RELEASE
  Architecture: $ARCH
  Work Directory: $WORK_DIR
  Output Directory: $OUTPUT_DIR
  Compression: Level $COMPRESSION_LEVEL ($SQUASHFS_COMP)
  Parallel Jobs: $PARALLEL_JOBS
  Incremental: $INCREMENTAL
  Debug: $DEBUG
EOF
}

# Initialize configuration
init_config() {
    # Validate settings
    validate_arch || exit 1
    validate_compression || exit 1
    
    # Create directories
    mkdir -p "$WORK_DIR"
    mkdir -p "$OUTPUT_DIR"
    mkdir -p "$CACHE_DIR"
    mkdir -p "$LOG_DIR"
    
    # Export for sub-scripts
    export_config
    
    return 0
}

# Run initialization if this file is sourced
if [[ "${BASH_SOURCE[0]}" != "${0}" ]]; then
    init_config
fi
