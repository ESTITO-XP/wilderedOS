# Development preset
DEV_TOOLS=(
    "build-essential"
    "git"
    "vim"
    "neovim"
    "tmux"
    "python3-full"
    "nodejs"
    "npm"
    "gcc"
    "g++"
    "make"
    "cmake"
)

# Media preset
