#!/bin/bash
################################################################################
# WilderedOS Base Edition Configuration
# Minimal terminal-based system with core components only
################################################################################

# Edition information
EDITION_NAME="base"
EDITION_DESCRIPTION="Minimal terminal-based system"
EDITION_FULLNAME="WilderedOS Base Edition"

# Features
ENABLE_SIDEBAR=false
ENABLE_SMART_STORAGE=false
ENABLE_WIDGETS=false
ENABLE_WINE=false

# Default theme
DEFAULT_THEME="liquid-glass"

# Package selection (minimal)
# See packages/base.list for full package list

# Performance optimizations for low-end hardware
SWAPPINESS=60
ENABLE_ZRAM=true
PRELOAD_ENABLED=false

# UI settings
TERMINAL_TRANSPARENCY=0  # Opaque by default for best compatibility
TERMINAL_BLUR=false
ANIMATION_SPEED="fast"

# Edition-specific notes
EDITION_NOTES="
Base Edition is designed for:
- Very old hardware (512MB RAM minimum)
- Minimal resource usage
- Maximum control over installed software
- Users who want to build up from scratch
"
