#!/bin/bash
################################################################################
# WilderedOS Test Edition Configuration
# Standard edition + Wine for Windows application support
################################################################################

# Edition information
EDITION_NAME="test"
EDITION_DESCRIPTION="Standard + Wine for Windows apps"
EDITION_FULLNAME="WilderedOS Test Edition"

# Features (inherits from standard)
ENABLE_SIDEBAR=true
ENABLE_SMART_STORAGE=true
ENABLE_WIDGETS=true
ENABLE_WINE=true

# Wine configuration
WINE_VERSION="stable"  # stable, staging, or devel
WINE_TRICKS=true       # Install winetricks
WINE_MONO=true         # Install wine-mono for .NET apps
WINE_GECKO=true        # Install wine-gecko for browser components

# Default theme
DEFAULT_THEME="liquid-glass"

# Sidebar configuration
SIDEBAR_POSITION="right"
SIDEBAR_WIDTH=25
SIDEBAR_AUTO_HIDE=false
SIDEBAR_WIDGETS="system_monitor,clock,quick_launch,recent_files,wine_apps"

# Smart Storage configuration
SMART_STORAGE_ENABLED=true
SMART_STORAGE_AUTO_CATEGORIZE=true
SMART_STORAGE_WATCH_DIRS="/home"
SMART_STORAGE_ARCHIVE_THRESHOLD=30  # days
SMART_STORAGE_WINDOWS_APPS_CATEGORY=true  # Separate category for .exe files

# Package selection
# Standard packages + Wine + Windows app support
# See packages/test.list for full package list

# Performance settings
SWAPPINESS=60
ENABLE_ZRAM=true
PRELOAD_ENABLED=true

# UI settings
TERMINAL_TRANSPARENCY=15
TERMINAL_BLUR=true
ANIMATION_SPEED="normal"

# Shell configuration
DEFAULT_SHELL="bash"
INSTALL_ZSH=true

# Additional features
ENABLE_WIDGETS=true
ENABLE_PINNED_WEBSITES=true
ENABLE_SPLIT_SCREEN=true
MAX_SPLIT_WINDOWS=6

# Wine-specific settings
WINE_PREFIX="/home/$LIVE_USER/.wine"
WINE_DESKTOP_INTEGRATION=true  # Create .desktop files for Windows apps
WINE_FILE_ASSOCIATIONS=true    # Associate .exe files with Wine

# Edition-specific notes
EDITION_NOTES="
Test Edition includes everything from Standard plus:
- Wine pre-installed and configured
- Support for running Windows .exe applications
- Winetricks for easy Windows component installation
- Automatic Wine prefix setup
- Integration with Smart Storage for Windows apps
- Ideal for users transitioning from Windows
"
