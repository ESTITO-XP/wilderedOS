#!/bin/bash
################################################################################
# WilderedOS Standard Edition Configuration
# Full featured terminal system with sidebar and Smart Storage
################################################################################

# Edition information
EDITION_NAME="standard"
EDITION_DESCRIPTION="Full featured terminal system"
EDITION_FULLNAME="WilderedOS Standard Edition"

# Features
ENABLE_SIDEBAR=true
ENABLE_SMART_STORAGE=true
ENABLE_WIDGETS=true
ENABLE_WINE=false

# Default theme
DEFAULT_THEME="liquid-glass"

# Sidebar configuration
SIDEBAR_POSITION="right"
SIDEBAR_WIDTH=25
SIDEBAR_AUTO_HIDE=false
SIDEBAR_WIDGETS="system_monitor,clock,quick_launch,recent_files"

# Smart Storage configuration
SMART_STORAGE_ENABLED=true
SMART_STORAGE_AUTO_CATEGORIZE=true
SMART_STORAGE_WATCH_DIRS="/home"
SMART_STORAGE_ARCHIVE_THRESHOLD=30  # days

# Package selection
# Base packages + additional tools
# See packages/standard.list for full package list

# Performance settings
SWAPPINESS=60
ENABLE_ZRAM=true
PRELOAD_ENABLED=true

# UI settings
TERMINAL_TRANSPARENCY=15  # 15% transparency for liquid glass effect
TERMINAL_BLUR=true
ANIMATION_SPEED="normal"

# Shell configuration
DEFAULT_SHELL="bash"
INSTALL_ZSH=true
INSTALL_OH_MY_BASH=false

# Additional features
ENABLE_WIDGETS=true
ENABLE_PINNED_WEBSITES=true
ENABLE_SPLIT_SCREEN=true
MAX_SPLIT_WINDOWS=6

# Edition-specific notes
EDITION_NOTES="
Standard Edition includes:
- Sidebar companion with widgets
- Smart Storage for automatic organization
- Archive apps feature
- Enhanced terminal themes
- Full suite of TUI applications
- Recommended for most users
"
